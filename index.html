<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nike</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #0a0a1a;
            min-height: 100vh;
            font-family: 'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', sans-serif;
            overflow: hidden;
        }
        .page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        .page.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* ----- 第一页 ----- */
        #page1 {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .question-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border-radius: 36px;
            padding: 2.2rem 3rem;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), inset 0 2px 4px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            max-width: 80vw;
        }
        .question-card h1 {
            color: #f0e6ff;
            font-size: 1.6rem;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-shadow: 0 0 14px rgba(180, 130, 255, 0.5);
            margin-bottom: 1.8rem;
            line-height: 1.5;
            white-space: nowrap;
        }
        @media (max-width: 750px) {
            .question-card h1 {
                font-size: 1.1rem;
                white-space: normal;
                letter-spacing: 1px;
            }
            .question-card {
                padding: 1.5rem 1.2rem;
            }
        }
        .buttons {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 0.7rem 2.5rem;
            border: none;
            border-radius: 50px;
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 1.2, 0.8, 1);
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.6);
            background: #2e1b4e;
            color: #d9c9ff;
            border: 1px solid #9f7aea;
            transform-origin: center;
        }
        .btn:hover {
            filter: brightness(1.2);
            box-shadow: 0 0 25px #9f7aea;
        }
        .btn-yes {
            background: #4c2a7a;
            color: #ffffff;
            border-color: #c084fc;
        }
        .btn-no {
            background: #1e1e2f;
            color: #b0b0d0;
            border-color: #5a4a7a;
        }
        .hint {
            margin-top: 1.2rem;
            color: #8a7aa0;
            font-size: 0.75rem;
            letter-spacing: 1.5px;
        }

        /* ----- 第二页 ----- */
        #page2 {
            background: #0b0710;
            z-index: 20;
            overflow: hidden;
        }
        .layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #heartCanvas {
            z-index: 1;
            display: block;
            pointer-events: none;
        }
        #flowLayer {
            z-index: 2;
            overflow: hidden;
            pointer-events: none;
            mix-blend-mode: screen;
        }

        .flow-item {
            position: absolute;
            white-space: nowrap;
            font-size: 1.8rem;
            font-weight: 900;
            opacity: 0.85;
            color: #d8b0ff;
            text-shadow:
                0 0 10px currentColor,
                0 0 20px #b57bee,
                0 0 32px #7a3caf;
            letter-spacing: 3px;
            will-change: transform;
            -webkit-text-stroke: 0.5px rgba(255, 200, 255, 0.6);
            top: 0;
            left: 0;
        }
        .flow-item:nth-child(odd) {
            color: #ffb3f0;
            text-shadow:
                0 0 10px #ff6bd6,
                0 0 20px #ff3ca8,
                0 0 35px #cc0077;
        }
        .flow-item:nth-child(3n) {
            color: #b8e2ff;
            text-shadow:
                0 0 10px #4aa8ff,
                0 0 20px #2e7eff,
                0 0 35px #0055cc;
            font-size: 2.2rem;
            opacity: 0.75;
        }
        .flow-item:nth-child(5n+2) {
            color: #ffe484;
            text-shadow:
                0 0 10px #ffbb33,
                0 0 20px #ff9900,
                0 0 35px #cc6600;
            font-size: 2rem;
            opacity: 0.9;
        }
        .flow-item:nth-child(7n+4) {
            color: #b5ffb5;
            text-shadow:
                0 0 10px #33ff77,
                0 0 20px #00cc44,
                0 0 35px #008833;
            font-size: 1.6rem;
            opacity: 0.8;
        }
        /* ★ Kitty 专属样式：更亮、更可爱 */
        .flow-item.kitty {
            color: #ffd6f0;
            text-shadow:
                0 0 12px #ff8de0,
                0 0 24px #ff4db8,
                0 0 40px #cc0077;
            font-size: 2.4rem;
            opacity: 0.95;
            -webkit-text-stroke: 1px rgba(255, 220, 245, 0.8);
        }
        .flow-item.kitty-emoji {
            color: #fff0fa;
            text-shadow:
                0 0 14px #ff9ee6,
                0 0 28px #ff5cbd,
                0 0 45px #cc0077;
            font-size: 2.6rem;
            opacity: 1;
        }
        @media (max-width: 600px) {
            .flow-item {
                font-size: 1.2rem !important;
                letter-spacing: 1px;
                opacity: 0.8 !important;
            }
            .flow-item:nth-child(3n) {
                font-size: 1.5rem !important;
            }
            .flow-item.kitty {
                font-size: 1.6rem !important;
            }
            .flow-item.kitty-emoji {
                font-size: 1.8rem !important;
            }
        }
    </style>
</head>
<body>
    <!-- 第一页 -->
    <div id="page1" class="page active">
        <div class="question-card">
            <h1>王妮柯你愿意陪我去看<br>薛之谦演唱会吗？？？</h1>
            <div class="buttons">
                <button id="yesBtn" class="btn btn-yes">愿意</button>
                <button id="noBtn" class="btn btn-no">不愿意</button>
            </div>
            <!-- <div class="hint">❤️ 点击「愿意」进入爱心世界 ❤️</div> -->
        </div>
    </div>

    <!-- 第二页 -->
    <div id="page2" class="page">
        <canvas id="heartCanvas" class="layer"></canvas>
        <div id="flowLayer" class="layer"></div>
    </div>

    <script>
        // ===== 第一页交互 =====
        const page1 = document.getElementById('page1');
        const page2 = document.getElementById('page2');
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');

        let yesScale = 1.0;
        let noScale = 1.0;
        let started = false;

        function applyScale() {
            yesBtn.style.transform = `scale(${yesScale})`;
            noBtn.style.transform = `scale(${noScale})`;
            noBtn.style.pointerEvents = noScale < 0.15 ? 'none' : 'auto';
            noBtn.style.opacity = noScale < 0.15 ? '0.3' : '1';
        }

        noBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            noScale = Math.max(0.05, noScale * 0.65);
            yesScale = Math.min(2.5, yesScale * 1.3);
            applyScale();
        });

        yesBtn.addEventListener('click', function() {
            page1.classList.remove('active');
            page2.classList.add('active');

            if (!started) {
                started = true;
                setTimeout(() => {
                    initHeart();
                    initFlowText();
                    startFlowAnimation();
                }, 50);
            }
        });

        applyScale();

        // ===== 第二页：粒子更细腻的炫酷爱心 =====
        let canvas, ctx, width, height;
        let particles = [];
        let pulseRings = [];
        let sparkles = [];
        let orbitParticles = [];
        let shockwaves = [];
        let heartAnimId = null;

        const HUE_MIN = 280;
        const HUE_RANGE = 70;

        function getHeartScale() {
            const minDim = Math.min(window.innerWidth, window.innerHeight);
            if (minDim >= 900) return 17;
            return Math.max(5.5, 17 * (minDim / 900));
        }

        function getParticleCount() {
            const minDim = Math.min(window.innerWidth, window.innerHeight);
            if (minDim >= 900) return 550;
            return Math.max(260, Math.floor(550 * (minDim / 900)));
        }

        let HEART_SCALE = 17;
        let PARTICLE_COUNT = 550;
        const GLOW_LAYERS = 5;

        function initHeart() {
            canvas = document.getElementById('heartCanvas');
            if (!canvas) return;
            ctx = canvas.getContext('2d');

            HEART_SCALE = getHeartScale();
            PARTICLE_COUNT = getParticleCount();

            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;

            window.addEventListener('resize', () => {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
                HEART_SCALE = getHeartScale();
                PARTICLE_COUNT = getParticleCount();
                buildParticles();
                buildOrbitParticles();
            });

            buildParticles();
            buildOrbitParticles();

            pulseRings = [];
            shockwaves = [];
            sparkles = [];
            for (let i = 0; i < 50; i++) {
                sparkles.push({
                    angle: Math.random() * Math.PI * 2,
                    dist: 0.7 + Math.random() * 0.9,
                    phase: Math.random() * Math.PI * 2,
                    speed: 0.3 + Math.random() * 2.0,
                    size: 0.5 + Math.random() * 1.8,
                });
            }

            if (heartAnimId) cancelAnimationFrame(heartAnimId);
            drawHeart();
        }

        function buildParticles() {
            particles = [];
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                let offset;
                const r = Math.random();
                if (r < 0.25) {
                    offset = 0.96 + Math.random() * 0.10;
                } else if (r < 0.70) {
                    offset = 0.55 + Math.random() * 0.40;
                } else {
                    offset = 0.20 + Math.random() * 0.40;
                }
                const t = Math.random() * Math.PI * 2;
                const sizeBase = Math.min(window.innerWidth, window.innerHeight) / 900;
                const sizeScale = Math.max(0.5, Math.min(0.95, sizeBase));

                particles.push({
                    baseT: t,
                    offset: offset,
                    phase: Math.random() * Math.PI * 2,
                    size: (1.2 + Math.random() * 1.8) * sizeScale,
                    hue: HUE_MIN + Math.random() * HUE_RANGE,
                    isInner: offset < 0.9,
                    hueSpeed: 0.3 + Math.random() * 0.6,
                });
            }
        }

        function buildOrbitParticles() {
            orbitParticles = [];
            const count = 70;
            for (let i = 0; i < count; i++) {
                orbitParticles.push({
                    baseT: (i / count) * Math.PI * 2,
                    offset: 1.15 + Math.random() * 0.55,
                    speed: 0.15 + Math.random() * 0.35,
                    size: 0.6 + Math.random() * 1.2,
                    hue: HUE_MIN + Math.random() * HUE_RANGE,
                    phase: Math.random() * Math.PI * 2,
                });
            }
        }

        function heartPoint(t, scale, cx, cy) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            return { x: cx + x * scale, y: cy - y * scale };
        }

        function heartPath(scale, cx, cy, step) {
            ctx.beginPath();
            for (let a = 0; a <= Math.PI * 2; a += step) {
                const x = 16 * Math.pow(Math.sin(a), 3);
                const y = 13 * Math.cos(a) - 5 * Math.cos(2*a) - 2 * Math.cos(3*a) - Math.cos(4*a);
                const px = cx + x * scale;
                const py = cy - y * scale;
                if (a === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
        }

        function drawHeart() {
            if (!ctx) return;
            ctx.fillStyle = 'rgba(11, 7, 16, 0.45)';
            ctx.fillRect(0, 0, width, height);

            const time = Date.now() / 450;
            const tSec = Date.now() / 1000;
            const beat = 0.85 + 0.25 * Math.sin(time) + 0.08 * Math.sin(time * 2.3);
            const beatPulse = Math.abs(Math.sin(time));
            const cx = width / 2;
            const cy = height / 2 - 20;

            // 1. 紫粉色光晕
            const glowAlphaMul = Math.min(1, Math.min(width, height) / 900 + 0.3);
            for (let layer = GLOW_LAYERS; layer >= 1; layer--) {
                const layerScale = HEART_SCALE * beat * (1.0 + layer * 0.055);
                const alpha = (0.075 / layer) * glowAlphaMul;
                const glowHue = 310 + Math.sin(tSec * 0.4 + layer * 0.8) * 25;

                heartPath(layerScale, cx, cy, 0.05);
                ctx.fillStyle = `hsla(${glowHue}, 100%, 60%, ${alpha})`;
                ctx.fill();
            }

            // 2. 心跳冲击波
            if (beatPulse > 0.93 && (shockwaves.length === 0 || (tSec - shockwaves[shockwaves.length-1].born) > 0.35)) {
                shockwaves.push({ born: tSec, life: 1.0 });
            }
            for (let i = shockwaves.length - 1; i >= 0; i--) {
                const w = shockwaves[i];
                const age = tSec - w.born;
                const progress = age / w.life;
                if (progress >= 1) {
                    shockwaves.splice(i, 1);
                    continue;
                }
                const ringScale = HEART_SCALE * beat * (1.0 + progress * 1.1);
                const alpha = (1 - progress) * 0.45;
                const ringHue = 310 + progress * 30;

                heartPath(ringScale, cx, cy, 0.08);
                ctx.strokeStyle = `hsla(${ringHue}, 100%, 75%, ${alpha})`;
                ctx.lineWidth = 2.5 * (1 - progress) + 0.5;
                ctx.shadowColor = `hsla(${ringHue}, 100%, 75%, 1)`;
                ctx.shadowBlur = 25;
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // 3. 能量脉冲环
            if (pulseRings.length === 0 || (tSec - pulseRings[pulseRings.length - 1].born) > 1.3) {
                pulseRings.push({ born: tSec, life: 1.8 });
            }
            for (let i = pulseRings.length - 1; i >= 0; i--) {
                const ring = pulseRings[i];
                const age = tSec - ring.born;
                const progress = age / ring.life;
                if (progress >= 1) {
                    pulseRings.splice(i, 1);
                    continue;
                }
                const ringScale = HEART_SCALE * beat * (1.0 + progress * 0.85);
                const alpha = (1 - progress) * 0.25;
                const ringHue = 310 + progress * 25;

                heartPath(ringScale, cx, cy, 0.08);
                ctx.strokeStyle = `hsla(${ringHue}, 100%, 70%, ${alpha})`;
                ctx.lineWidth = 1.8 * (1 - progress) + 0.5;
                ctx.shadowColor = `hsla(${ringHue}, 100%, 70%, 0.8)`;
                ctx.shadowBlur = 18;
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // 4. 环绕轨道粒子
            for (let o of orbitParticles) {
                o.baseT += 0.008 * o.speed;
                const t = o.baseT;
                const scale = HEART_SCALE * beat * o.offset;
                const pt = heartPoint(t, scale, cx, cy);
                const z = Math.sin(t * 2 + tSec * 0.5) * 0.5 + 0.5;
                const alpha = 0.3 + z * 0.7;
                const size = o.size * (0.6 + z * 0.8);
                const hue = o.hue + Math.sin(tSec * 0.5 + o.phase) * 15;

                ctx.beginPath();
                ctx.arc(pt.x, pt.y, size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${hue}, 100%, ${70 + z * 20}%, ${alpha})`;
                ctx.shadowColor = `hsl(${hue}, 100%, 75%)`;
                ctx.shadowBlur = 8 + z * 8;
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // 5. 主体粒子
            for (let p of particles) {
                const scale = HEART_SCALE * beat * p.offset;
                let pt = heartPoint(p.baseT, scale, cx, cy);

                const jitterAmp = p.isInner ? 1.0 : 2.2;
                const jx = Math.sin(time * 2 + p.phase) * jitterAmp;
                const jy = Math.cos(time * 2.5 + p.phase * 1.3) * jitterAmp;

                const x = pt.x + jx;
                const y = pt.y + jy;

                const size = p.size * (0.85 + 0.4 * Math.sin(time * 3 + p.phase));

                const hue = p.hue + Math.sin(tSec * 0.8 * p.hueSpeed + p.phase) * 20;
                const baseLight = p.isInner ? 62 : 72;
                const light = baseLight + 22 * Math.sin(time * 2 + p.phase);

                const grad = ctx.createRadialGradient(x, y, 0, x, y, size * 1.4);
                grad.addColorStop(0, `hsl(${hue}, 100%, ${Math.min(98, light + 18)}%)`);
                grad.addColorStop(0.45, `hsl(${hue}, 100%, ${light}%)`);
                grad.addColorStop(1, `hsla(${hue}, 100%, ${light}%, 0)`);

                ctx.beginPath();
                ctx.arc(x, y, size * 1.4, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(x, y, size * 0.4, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${hue}, 100%, ${Math.min(98, light + 22)}%)`;
                ctx.shadowColor = `hsl(${hue}, 100%, 80%)`;
                ctx.shadowBlur = p.isInner ? 8 : 14;
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // 6. 星芒
            for (let s of sparkles) {
                s.angle += 0.008 * s.speed;
                const blink = Math.sin(tSec * 4 * s.speed + s.phase);
                if (blink < 0.2) continue;

                const dist = HEART_SCALE * beat * s.dist * 1.6;
                const sx = cx + Math.cos(s.angle) * dist;
                const sy = cy - Math.sin(s.angle) * dist * 0.85;

                const sparkleSize = s.size * (0.4 + blink * 0.9);
                const sparkleHue = 310 + Math.sin(tSec * 0.5 + s.phase) * 25;

                ctx.save();
                ctx.translate(sx, sy);
                ctx.rotate(s.angle * 0.7);
                ctx.strokeStyle = `hsla(${sparkleHue}, 100%, 90%, ${blink * 0.85})`;
                ctx.lineWidth = 0.9;
                ctx.shadowColor = `hsl(${sparkleHue}, 100%, 80%)`;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.moveTo(-sparkleSize * 2.5, 0);
                ctx.lineTo(sparkleSize * 2.5, 0);
                ctx.moveTo(0, -sparkleSize * 2.5);
                ctx.lineTo(0, sparkleSize * 2.5);
                ctx.stroke();
                ctx.restore();
                ctx.shadowBlur = 0;
            }

            // 7. 中心白核
            const coreR = HEART_SCALE * beat * (0.38 + beatPulse * 0.1);
            const coreGrad = ctx.createRadialGradient(cx, cy - 5, 0, cx, cy - 5, coreR);
            coreGrad.addColorStop(0, `hsla(320, 100%, 98%, ${0.45 + beatPulse * 0.3})`);
            coreGrad.addColorStop(0.35, `hsla(320, 100%, 88%, ${0.2 + beatPulse * 0.2})`);
            coreGrad.addColorStop(1, `hsla(320, 100%, 70%, 0)`);
            ctx.beginPath();
            ctx.arc(cx, cy - 5, coreR, 0, Math.PI * 2);
            ctx.fillStyle = coreGrad;
            ctx.fill();

            heartAnimId = requestAnimationFrame(drawHeart);
        }

        // ===== 第二页：文字流（加入 Kitty） =====
        const flowWords = [
            // 原有内容
            '王妮柯', '薛之谦', 'nike', '王妮柯', '薛之谦', 'nike',
            '天外来物', '演员', '丑八怪', '认真的雪', '绅士', '意外',
            '你还要我怎样', '一半', '刚刚好', '方圆几里', '动物世界',
            '违背的青春', '彩券', '陪你去流浪', '像风一样', '暧昧',
            '木偶人', '慢半拍', '这么久没见', '笑场', '尘', '聊表心意',
            '王妮柯', '薛之谦', 'nike', '天外来物', '演员', '绅士',
            '认真的雪', '你还要我怎样', '违背的青春', '像风一样',
            // ★ Kitty 相关
            '🎀', '🐱', '🐱🎀',
        ];

        let flowItems = [];
        let flowAnimId = null;
        let lastFlowTs = 0;

        function initFlowText() {
            const layer = document.getElementById('flowLayer');
            if (!layer) return;

            layer.innerHTML = '';
            flowItems = [];

            const shuffled = [...flowWords].sort(() => Math.random() - 0.5);
            const minDim = Math.min(window.innerWidth, window.innerHeight);
            // ★ 数量增加一点，让 kitty 出现频率更高
            const totalCount = minDim < 600 ? 110 : 180;
            const h = window.innerHeight;

            for (let i = 0; i < totalCount; i++) {
                const div = document.createElement('div');
                div.className = 'flow-item';
                const text = shuffled[i % shuffled.length];
                div.textContent = text;

                // ★ 根据内容添加特殊样式
                const lower = text.toLowerCase();
                if (lower.includes('kitty') || text.includes('🐱')) {
                    if (text.includes('🐱') || text.includes('🎀')) {
                        div.classList.add('kitty-emoji');
                    } else {
                        div.classList.add('kitty');
                    }
                }

                div.style.left = (Math.random() * 96) + '%';
                const sizeMul = 0.85 + Math.random() * 0.5;
                // kitty 的字体大小已经在 CSS 里定义，这里只对普通项设置
                if (!div.classList.contains('kitty') && !div.classList.contains('kitty-emoji')) {
                    div.style.fontSize = `${1.8 * sizeMul}rem`;
                }
                layer.appendChild(div);
                flowItems.push({
                    el: div,
                    y: Math.random() * h,
                    speed: 45 + Math.random() * 85,
                    height: div.offsetHeight || 50,
                });
            }
        }

        function startFlowAnimation() {
            if (flowAnimId) cancelAnimationFrame(flowAnimId);
            lastFlowTs = performance.now();
            flowAnimId = requestAnimationFrame(updateFlow);
        }

        function updateFlow(now) {
            let dt = (now - lastFlowTs) / 1000;
            lastFlowTs = now;
            if (dt > 0.2) dt = 0.2;

            const h = window.innerHeight;

            for (let item of flowItems) {
                item.y += item.speed * dt;
                if (item.y > h + item.height) item.y = -item.height - Math.random() * 150;
                item.el.style.transform = `translateY(${item.y}px)`;
            }
            flowAnimId = requestAnimationFrame(updateFlow);
        }
